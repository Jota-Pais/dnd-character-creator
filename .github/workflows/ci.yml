name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `tsc -b` (build mode) e não `tsc --noEmit`: o tsconfig raiz é só project references
      # com "files": [], então --noEmit sozinho sai com exit 0 sem checar arquivo nenhum.
      - run: npx tsc -b
      - run: npx vitest run
